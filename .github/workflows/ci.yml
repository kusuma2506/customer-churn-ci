
name: Customer Churn CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Debug repository files
        run: |
          pwd
          ls -la
          find . -maxdepth 4 -type f

      - name: Check Python module
        run: |
          python -c "import os, sys; print('Working directory:', os.getcwd()); print('Python path:', sys.path); print('Root files:', os.listdir('.')); print('Module exists:', os.path.isfile('churn_data.py'))"
          python -c "import churn_data; print('Module import successful')"

      - name: Run automated tests
        run: python -m unittest discover -s tests -v
