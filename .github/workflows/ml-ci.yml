name: Customer Churn ML CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-test-deliver:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify customer churn dataset
        run: |
          python -c "from pathlib import Path; p=Path('data/customer_churn.csv.csv'); assert p.is_file(), f'Dataset missing: {p}'; print(f'Dataset found: {p}')"

      - name: Train customer churn model
        run: python train_model.py

      - name: Check ML quality gate
        run: python quality_gate.py

      - name: Run automated ML tests
        run: python -m unittest test_ml_pipeline -v

      - name: Run prediction application tests
        run: python -m unittest test_app.py -v

      - name: Prepare release candidate
        run: |
          mkdir -p release_candidate
          cp app.py release_candidate/
          cp customer_churn_model.pkl release_candidate/
          cp metrics.json release_candidate/
          cp requirements.txt release_candidate/
          printf '%s\n' \
            "Customer Churn Prediction Application" \
            "Start: python app.py" \
            "Health endpoint: GET /" \
            "Prediction endpoint: POST /predict" \
            "Prediction classes: CHURN or NO_CHURN" \
            > release_candidate/DEPLOYMENT.txt

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: customer-churn-ml-release
          path: release_candidate/
          if-no-files-found: error
          retention-days: 7
