name: Customer Churn ML CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  train-test-deliver:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify customer churn dataset
        run: |
          python -c "from pathlib import Path; p=Path('data/customer_churn.csv.csv'); assert p.is_file(), f'Dataset missing: {p}'; print(f'Dataset found: {p}')"

      - name: Train customer churn model
        run: python train_model.py

      - name: Check ML quality gate
        run: python quality_gate.py

      - name: Run automated ML tests
        run: python -m unittest test_ml_pipeline -v

      - name: Run prediction application tests
        run: python -m unittest test_app.py -v


      - name: Prepare release candidate
        run: |
          mkdir -p release_candidate
          cp app.py release_candidate/
          cp customer_churn_model.pkl release_candidate/
          cp metrics.json release_candidate/
          cp requirements.txt release_candidate/
          cp Dockerfile release_candidate/
          cp .dockerignore release_candidate/
          printf '%s\n' \
            "Customer Churn Prediction Application" \
            "Start: python app.py" \
            "Health endpoint: GET /" \
            "Prediction endpoint: POST /predict" \
            "Prediction classes: CHURN or NO_CHURN" \
            > release_candidate/DEPLOYMENT.txt

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: customer-churn-ml-release
          path: release_candidate/
          if-no-files-found: error
          retention-days: 7


      - name: Build Docker image
        run: docker build -t customer-churn-ml:${{ github.sha }} .

      - name: Start Docker container
        run: |
          docker run -d \
            --name customer-churn-container \
            -p 5000:5000 \
            customer-churn-ml:${{ github.sha }}

      - name: Wait for application to become ready
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:5000/health; then
              echo "Application is ready."
              exit 0
            fi
            echo "Waiting for application... attempt $i"
            sleep 2
          done

          echo "Application did not become ready."
          docker logs customer-churn-container
          exit 1

      - name: Test customer churn prediction endpoint
        run: |
          response=$(curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"Age":35,"Gender":"Female","Tenure":12,"Usage Frequency":20,"Support Calls":2,"Payment Delay":5,"Subscription Type":"Standard","Contract Length":"Annual","Total Spend":500.0,"Last Interaction":10}' \
            http://localhost:5000/predict)

          echo "Prediction response: $response"
          echo "$response" | grep -q '"prediction"'
          echo "$response" | grep -q '"prediction_code"'

      - name: Show Docker container logs
        if: always()
        run: docker logs customer-churn-container || true

      - name: Stop and remove Docker container
        if: always()
        run: docker rm -f customer-churn-container || true
      - name: Stop and remove Docker container
        if: always()
        run: docker rm -f customer-churn-container || true
