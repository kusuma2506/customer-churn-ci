
name: Customer Churn ML CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install ML dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify dataset
        run: |
          python -c "from pathlib import Path; p=Path('data/customer_churn.csv.csv'); print('Dataset exists:', p.is_file()); print('Dataset size:', p.stat().st_size if p.is_file() else 'missing'); assert p.is_file(), 'Dataset is missing from the repository'"

      - name: Train customer churn model
        run: python train_model.py

      - name: Run automated ML tests
        run: python -m unittest test_ml_pipeline -v
